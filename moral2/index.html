<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>성실 퍼즐을 완성하라!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card { touch-action: none; transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s; }
        .dragging { opacity: 0.8; transform: scale(1.05); z-index: 50; cursor: grabbing; }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }
        .card.error { border: 2px solid #ef4444 !important; background-color: #fee2e2 !important; }
        .error-msg { color: #ef4444; font-size: 0.65rem; font-weight: bold; margin-top: 4px; display: none; }
        .card.error .error-msg { display: block; }
        .zone-content { transition: background-color 0.2s; }
        .drop-highlight { background-color: #f1f5f9 !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-2 md:p-8 overflow-x-hidden">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-4 md:mb-8">
            <h1 class="text-2xl md:text-4xl font-extrabold text-slate-800 mb-1">🧩 성실 조각을 완성하라!</h1>
            <p class="text-slate-600 text-sm md:text-base">행동 카드를 분류하고 '성실'의 의미를 완성해 보세요.</p>
            <div id="progress-bar" class="mt-4 font-bold text-blue-600">진행률: 0 / 40</div>
        </header>

        <div class="flex gap-2 justify-center mb-6">
            <button onclick="shuffleCards()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg text-sm font-bold transition">섞기</button>
            <button onclick="resetGame()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold transition">처음부터</button>
        </div>

        <div id="game-zone" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Bank: Horizontal scroll on mobile, Vertical on Desktop -->
            <div id="bank" class="bg-white p-3 md:p-6 rounded-2xl shadow-sm border border-slate-200 md:h-[600px]">
                <h2 class="font-bold text-slate-700 mb-3 flex items-center text-sm md:text-base">
                    <span class="mr-2">🗂️</span> 행동 카드 목록<br>(드래그 하세요!)
                </h2>
                <div id="cards-container" class="flex md:flex-col gap-2 overflow-x-auto md:overflow-y-auto md:overflow-x-hidden h-32 md:h-[500px] p-1"></div>
            </div>

            <!-- Drop Zones -->
            <div id="sincere-zone" class="drop-zone bg-white p-3 md:p-6 rounded-2xl shadow-sm border border-slate-200 h-[250px] md:h-[600px] flex flex-col" data-type="sincere">
                <h2 class="font-bold text-green-600 mb-2 flex items-center text-sm md:text-base">
                    <span class="mr-2">✅</span> 성실한 행동
                </h2>
                <div class="zone-content flex-1 overflow-y-auto space-y-2"></div>
            </div>

            <div id="insincere-zone" class="drop-zone bg-white p-3 md:p-6 rounded-2xl shadow-sm border border-slate-200 h-[250px] md:h-[600px] flex flex-col" data-type="insincere">
                <h2 class="font-bold text-red-600 mb-2 flex items-center text-sm md:text-base">
                    <span class="mr-2">⚠️</span> 성실하지 않은 행동
                </h2>
                <div class="zone-content flex-1 overflow-y-auto space-y-2"></div>
            </div>
        </div>

<div id="completion-modal"
     class="hidden fixed inset-0 flex items-center justify-center bg-black/50 z-50">

    <div class="bg-blue-600 text-white rounded-3xl p-8 text-center shadow-2xl w-11/12 max-w-lg">
        <h2 class="text-3xl font-bold mb-4">🎉 성실 퍼즐 완성!</h2>
        <p class="text-xl italic">"성실한 행동들의 공통점을 친구들과 이야기해 보세요."</p>
    </div>

</div>

    <script>
        const rawData = [
            { text: "숙제를 미루지 않고 한다.", type: "sincere" }, { text: "맡은 청소를 끝까지 한다.", type: "sincere" },
            { text: "준비물을 미리 챙긴다.", type: "sincere" }, { text: "약속 시간을 잘 지킨다.", type: "sincere" },
            { text: "줄넘기를 꾸준히 연습한다.", type: "sincere" }, { text: "읽은 책을 제자리에 꽂는다.", type: "sincere" },
            { text: "빌린 물건을 제때 돌려준다.", type: "sincere" }, { text: "어려운 문제도 끝까지 풀어 본다.", type: "sincere" },
            { text: "식판을 스스로 정리한다.", type: "sincere" }, { text: "친구와 한 약속을 지킨다.", type: "sincere" },
            { text: "악기를 매일 조금씩 연습한다.", type: "sincere" }, { text: "자신의 실수를 솔직하게 인정한다.", type: "sincere" },
            { text: "모둠에서 맡은 역할을 책임감 있게 한다.", type: "sincere" }, { text: "체육복을 전날 미리 준비한다.", type: "sincere" },
            { text: "쓰레기를 끝까지 분리배출한다.", type: "sincere" }, { text: "일기를 꾸준히 쓴다.", type: "sincere" },
            { text: "식사 후 스스로 자리를 정리한다.", type: "sincere" }, { text: "운동이 힘들어도 목표까지 노력한다.", type: "sincere" },
            { text: "부모님과 약속한 시간을 지킨다.", type: "sincere" }, { text: "학교 과제를 기한 안에 제출한다.", type: "sincere" },
            { text: "숙제를 내일 하려고 미룬다.", type: "insincere" }, { text: "힘들다고 맡은 일을 중간에 그만둔다.", type: "insincere" },
            { text: "준비물을 자주 잊어버린다.", type: "insincere" }, { text: "약속 시간에 늦고도 사과하지 않는다.", type: "insincere" },
            { text: "연습을 하루 하고 그만둔다.", type: "insincere" }, { text: "책을 아무 곳에나 두고 간다.", type: "insincere" },
            { text: "빌린 물건을 계속 미루고 돌려주지 않는다.", type: "insincere" }, { text: "어려운 문제를 보자마자 포기한다.", type: "insincere" },
            { text: "식판 정리를 친구에게 미룬다.", type: "insincere" }, { text: "친구와 한 약속을 쉽게 어긴다.", type: "insincere" },
            { text: "연습하기 싫다고 핑계를 댄다.", type: "insincere" }, { text: "실수를 다른 사람 탓으로 돌린다.", type: "insincere" },
            { text: "모둠 활동에서 아무 일도 하지 않는다.", type: "insincere" }, { text: "체육복을 챙기지 않아 수업에 참여하지 못한다.", type: "insincere" },
            { text: "귀찮다고 쓰레기를 아무 곳에 버린다.", type: "insincere" }, { text: "일기를 며칠씩 몰아서 쓴다.", type: "insincere" },
            { text: "먹은 자리를 그대로 두고 간다.", type: "insincere" }, { text: "조금 힘들다고 바로 쉬려고 한다.", type: "insincere" },
            { text: "부모님과의 약속을 자꾸 미룬다.", type: "insincere" }, { text: "과제를 하지 않고 제출하지 않는다.", type: "insincere" }
        ];

        let draggedEl = null;

        function createCard(item, index) {
            const card = document.createElement('div');
            card.className = "card bg-slate-100 p-3 rounded-xl border border-slate-200 shadow-sm text-xs md:text-sm flex-shrink-0 w-40 md:w-auto select-none";
            card.dataset.type = item.type;
            card.id = `c${index}`;
            card.innerHTML = `${item.text}<div class="error-msg">다시 해보세요!</div>`;
            card.style.touchAction = 'none';

            card.addEventListener('pointerdown', (e) => {
                draggedEl = card;
                card.classList.add('dragging');
                card.setPointerCapture(e.pointerId);
            });

            card.addEventListener('pointerup', (e) => {
                if (!draggedEl) return;
                card.classList.remove('dragging');
                const dropTarget = document.elementFromPoint(e.clientX, e.clientY)?.closest('.drop-zone, #bank');
                if (dropTarget) handleDrop(card, dropTarget);
                draggedEl = null;
            });
            return card;
        }

        function handleDrop(card, target) {
            if (target.classList.contains('drop-zone')) {
                target.querySelector('.zone-content').appendChild(card);
                if (card.dataset.type !== target.dataset.type) {
                    card.classList.add('error', 'shake');
                    setTimeout(() => card.classList.remove('shake'), 400);
                } else {
                    card.classList.remove('error');
                }
            } else {
                card.classList.remove('error');
                document.getElementById('cards-container').appendChild(card);
            }
            validateGame();
        }

        function validateGame() {
            const placedCount = document.querySelectorAll('.zone-content .card').length;
            const errors = document.querySelectorAll('.card.error');
            document.getElementById('progress-bar').innerText = `진행률: ${placedCount} / 40`;
            
            if (placedCount === 40 && errors.length === 0) {
                document.getElementById('completion-modal').classList.remove('hidden');
                document.getElementById('game-zone').classList.add('opacity-50', 'pointer-events-none');
            }
        }

        function shuffleCards() {
            const container = document.getElementById('cards-container');
            const cards = Array.from(container.children);
            cards.sort(() => Math.random() - 0.5);
            cards.forEach(c => container.appendChild(c));
        }

        function resetGame() {
            location.reload();
        }

        // Initialize board
        const container = document.getElementById('cards-container');
        [...rawData].sort(() => Math.random() - 0.5).forEach((item, i) => container.appendChild(createCard(item, i)));
    </script>
</body>
</html>
